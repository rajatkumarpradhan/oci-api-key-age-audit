name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Demo - messy inventory flags all four rules
        run: |
          set +e
          python -m apikey_audit.cli samples/users_messy.json --as-of 2026-11-14
          code=$?
          set -e
          echo "demo exit code: $code"
          test "$code" -eq 2
      - name: Demo - clean inventory exits 0
        run: python -m apikey_audit.cli samples/users_clean.json --as-of 2026-11-14
